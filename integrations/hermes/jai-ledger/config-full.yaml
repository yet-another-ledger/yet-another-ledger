# Complete optional MCP tool allowlist for the full M15 workflow.
# Replace the profile's entire mcp_servers.jai entry with this block; do not
# merge separate role snippets because YAML mapping overlays can drop tools.
# The bearer token needs all eight frozen M15 scopes.
mcp_servers:
  jai:
    url: "http://127.0.0.1:8000/api/v1/mcp"
    headers:
      Authorization: "Bearer ${JAI_MCP_TOKEN}"
    tools:
      include:
        - submit_receipt
        - get_receipt_status
        - search_customers
        - get_customer
        - create_customer
        - search_catalog
        - list_document_templates
        - list_vat_options
        - preview_quote
        - create_quote_draft
        - get_quote
        - update_quote_draft
        - preview_invoice
        - create_invoice_draft
        - get_invoice
        - update_invoice_draft
      prompts: false
      resources: false
