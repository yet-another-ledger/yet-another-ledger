# M15 第 8 步普通发票准备的可选 MCP 工具白名单。
# Bearer token 需要 invoice:read、invoice:write_draft、customer:read 和 catalog:read。
# 请与仅收据配置及报价配置分开合并。
mcp_servers:
  jai:
    tools:
      include:
        - search_customers
        - get_customer
        - search_catalog
        - list_document_templates
        - list_vat_options
        - preview_invoice
        - create_invoice_draft
        - get_invoice
        - update_invoice_draft
      prompts: false
      resources: false
