# v0.14.0（M15 + SI4 + M18）完整可选工作流的 MCP 工具允许列表。
# 用此块整体替换 profile 的 mcp_servers.jai 项；不要合并多个角色片段，
# 因为 YAML 映射覆盖可能会丢失工具。Bearer token 需要当前完整的十项 scope。
mcp_servers:
  jai:
    url: "http://127.0.0.1:8000/api/v1/mcp"
    headers:
      Authorization: "Bearer ${JAI_MCP_TOKEN}"
    tools:
      include:
        - submit_receipt
        - get_receipt_status
        - search_customers
        - get_customer
        - create_customer
        - search_catalog
        - list_document_templates
        - list_vat_options
        - preview_quote
        - create_quote_draft
        - get_quote
        - update_quote_draft
        - preview_invoice
        - create_invoice_draft
        - get_invoice
        - update_invoice_draft
        - list_expenses
        - get_expense
        - get_mileage_options
        - preview_mileage_expense
        - create_mileage_expense
      prompts: false
      resources: false
