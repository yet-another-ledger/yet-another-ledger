[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yet-another-ledger"
version = "0.7.0"
description = "Yet Another Ledger – self-hosted invoicing for Dutch freelancers"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "mcp>=2.0,<3",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
    "fastapi-users[sqlalchemy]>=14.0.0",
    "pwdlib[argon2]>=0.2.0",
    "pyotp>=2.9.0",
    "aiosmtplib>=3.0.2",
    "jinja2>=3.1.0",
    "pycountry>=24.6.0",
    "nh3>=0.3.5",
    "apscheduler>=3.10.0,<4.0",
    "httpx>=0.28.0",
    "pypdfium2>=4.30.0",
    "Pillow>=11.0.0",
    "weasyprint>=63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.21.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jai"]

[project.scripts]
jai = "jai.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # Depends() in argument defaults is idiomatic FastAPI

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cssselect2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tinycss2.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require a running PostgreSQL (skipped by default; run with `pytest -m integration`)",
]
